[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
markers =
    groq: tests that call a live LLM provider (Anthropic by default; name kept for CI) — exclude with -m "not groq"
    slow: tests that load embedding models or hit local vector DB
    integration: live checks against the real Supabase project (opt-in: PERSONACR_RLS_LIVE=1)
filterwarnings =
    ignore::DeprecationWarning
