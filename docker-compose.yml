# Local development only — Redis queue + Prometheus/Grafana operator stack.
# Not a production/HA observability deployment.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - personacr_redis:/data
    command: ["redis-server", "--appendonly", "yes"]

  # RQ worker for async reviews (queue "reviews"). Opt-in — the image is large:
  #   docker compose --profile worker up -d redis worker
  # The API still runs on the host (uvicorn); both share Redis and the embedded
  # Chroma store via the ./backend/.chroma bind mount. Secrets come from
  # backend/.env at runtime (never baked into the image — see backend/.dockerignore).
  worker:
    profiles: ["worker"]
    build: ./backend
    image: personacr-backend:latest
    command: ["python", "-m", "backend.src.workers.worker"]
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/.chroma:/app/backend/.chroma
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - personacr_prom:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - personacr_grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  personacr_redis:
  personacr_prom:
  personacr_grafana:
