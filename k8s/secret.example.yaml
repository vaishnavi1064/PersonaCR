# TEMPLATE ONLY — copy to secret.yaml and fill in real values.
#   cp k8s/secret.example.yaml k8s/secret.yaml
# Do NOT commit secret.yaml (see .gitignore).
#
# Local/dev minikube demo — not a production secret management pattern.
apiVersion: v1
kind: Secret
metadata:
  name: personacr-secrets
  namespace: personacr
  labels:
    app.kubernetes.io/part-of: personacr
type: Opaque
#
# Only keys the backend reads. The frontend's Supabase anon key is NOT set here:
# it is baked into the Vite bundle at build time via
#   docker build --build-arg VITE_SUPABASE_URL=... --build-arg VITE_SUPABASE_ANON_KEY=...
# (see k8s/README.md). GitHub OAuth for login is configured in Supabase, not here.
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  # Only needed with LLM_PROVIDER=groq
  GROQ_API_KEY: ""
  SUPABASE_URL: "https://YOUR_PROJECT.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_ME"
  # Optional — used for private GitHub repo ingestion
  GITHUB_TOKEN: ""
