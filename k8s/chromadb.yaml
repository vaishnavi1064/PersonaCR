# ChromaDB StatefulSet + headless/ClusterIP Service — local/dev orchestration demo.
#
# The backend talks to this server via chromadb.HttpClient because
# CHROMADB_URL=http://chromadb:8000 is set in personacr-config (see
# backend/src/core/embedder.py). Without CHROMADB_URL (local dev) the backend
# falls back to an embedded PersistentClient under backend/.chroma.
#
# Keep the image tag equal to chromadb==<ver> in backend/requirements.txt —
# a 1.x client cannot talk to a 0.x server. Chroma 1.x reads /config.yaml
# (persist_path: "/data"), so the volume mounts at /data.
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: personacr
  labels:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/part-of: personacr
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: chromadb
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromadb
  namespace: personacr
  labels:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/part-of: personacr
spec:
  serviceName: chromadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chromadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromadb
        app.kubernetes.io/part-of: personacr
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:1.5.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: chroma-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
