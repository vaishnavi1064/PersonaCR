# Frontend Deployment + NodePort Service for minikube service access.
# Local/dev demo — not a production ingress/TLS setup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: personacr
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: personacr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: personacr
    spec:
      containers:
        - name: frontend
          image: personacr-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: personacr
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: personacr
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      # Fixed NodePort for predictable minikube service URL (local only)
      nodePort: 30080
