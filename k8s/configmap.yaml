# Non-secret configuration for local minikube demo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: personacr-config
  namespace: personacr
  labels:
    app.kubernetes.io/part-of: personacr
data:
  REDIS_URL: "redis://redis:6379/0"
  PERSONACR_METRICS_ENABLED: "1"
  # In-cluster service DNS names (for reference / future wiring)
  BACKEND_URL: "http://backend:8000"
  CHROMADB_URL: "http://chromadb:8000"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
