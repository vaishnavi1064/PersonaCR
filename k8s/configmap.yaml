# Non-secret configuration for local minikube demo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: personacr-config
  namespace: personacr
  labels:
    app.kubernetes.io/part-of: personacr
data:
  REDIS_URL: "redis://redis:6379/0"
  PERSONACR_METRICS_ENABLED: "1"
  # Read by backend/src/core/embedder.py → chromadb.HttpClient
  CHROMADB_URL: "http://chromadb:8000"
