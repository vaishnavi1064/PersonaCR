# RQ worker Deployment — runs background jobs from Redis queues "reviews" and
# "analyze". Local/dev minikube demo — 1 replica, not HA.
#
# Same image as the backend; runs backend/src/workers/worker.py (one RQ Worker
# listening on both queues) instead of uvicorn:
#   - POST /api/reviews       → review jobs (the UI's reviews run here)
#   - POST /api/analyze-jobs  → repo analysis (fetch, fingerprint, embed, summary)
# Results/status go back to Redis (GET /api/reviews/{id}, GET /api/analyze-jobs/{id},
# GET /api/repos). No Service: it only talks out to Redis, Chroma (HttpClient via
# CHROMADB_URL), Anthropic, GitHub and Supabase.
#
# Shutdown: on SIGTERM RQ finishes the current job before exiting, so a rollout
# or pod delete doesn't cut a review/analysis short if it ends within the grace
# period. Jobs killed anyway (longer, crash, OOM) are marked failed by the
# heartbeat check (backend/src/core/liveness.py) and can be retried.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: personacr
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: personacr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: personacr
    spec:
      terminationGracePeriodSeconds: 300
      # Block until Redis answers PING so the worker doesn't crash-loop on
      # "Connection refused" when the whole stack starts at once.
      initContainers:
        - name: wait-for-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until redis-cli -h redis -p 6379 ping | grep -q PONG; do echo "waiting for redis"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: worker
          image: personacr-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.src.workers.worker"]
          envFrom:
            - configMapRef:
                name: personacr-config
            - secretRef:
                name: personacr-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
