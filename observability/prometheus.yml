# Local/dev scrape config — points at the FastAPI host from the compose network.
# host.docker.internal works on Docker Desktop; override if needed.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: personacr
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          service: personacr-backend
