# PersonaCR — single-VM production stack (Azure Standard_B2als_v2: 2 vCPU, 4 GB RAM + 4 GB swap).
#
# Run from the repo root on the server (deploy/server-deploy.sh does this):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# Only Caddy publishes ports (80/443). Redis, Chroma, backend and worker are
# reachable only on the compose network. Every service has restart: unless-stopped,
# and Docker starts at boot, so after the daily auto-start the whole stack comes
# back by itself.
#
# Memory: limits are ceilings, not reservations. The sum is above 4 GB on purpose;
# the heavy peaks don't overlap (one RQ worker runs one job at a time), and the
# 4 GB swap file absorbs the rest. Measured peaks (evals/results/ops_measurements.json):
# worker review ~2.3 GiB (torch + MiniLM), analyze ~1.4 GiB (Jina, MAX_EMBED_TOKENS=1024),
# API idle ~200 MiB (+~1 GiB when chat loads Jina for code search).
name: personacr

x-backend-env: &backend-env
  REDIS_URL: redis://redis:6379/0
  CHROMADB_URL: http://chromadb:8000
  MAX_EMBED_TOKENS: "1024"
  # Model downloads go to the shared model_cache volume — fetched once, not per boot.
  FASTEMBED_CACHE_PATH: /models/fastembed
  HF_HOME: /models/huggingface
  # Nothing scrapes /metrics here (no Prometheus); Caddy also blocks it publicly.
  PERSONACR_METRICS_ENABLED: "0"
  ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN in deploy/.env.prod}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS certificates live here — losing them means re-issuing (Let's Encrypt rate limits).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    mem_limit: 128m
    logging: *logging

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: "."
        VITE_SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in deploy/.env.prod}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in deploy/.env.prod}
    image: personacr-frontend:prod
    restart: unless-stopped
    # nginx.conf proxies to "backend" — the name must resolve when nginx starts.
    depends_on:
      - backend
    mem_limit: 64m
    logging: *logging

  backend:
    build:
      context: ../backend
    image: personacr-backend:prod
    restart: unless-stopped
    env_file: .env.prod
    environment: *backend-env
    volumes:
      - model_cache:/models
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    mem_limit: 1536m
    memswap_limit: 2560m
    logging: *logging

  worker:
    # Same image as backend (built by the backend service), different command.
    image: personacr-backend:prod
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "backend.src.workers.worker"]
    env_file: .env.prod
    environment: *backend-env
    volumes:
      - model_cache:/models
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    # RQ finishes the running job on SIGTERM; give it time on deploys / shutdown.
    stop_grace_period: 5m
    # The image's HEALTHCHECK curls the API on :8000, which the worker doesn't serve.
    healthcheck:
      disable: true
    mem_limit: 2560m
    memswap_limit: 4096m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    logging: *logging

  chromadb:
    # Keep equal to chromadb==<ver> in backend/requirements.txt (1.x client ↔ 1.x server).
    image: chromadb/chroma:1.5.7
    restart: unless-stopped
    # Chroma 1.x reads /config.yaml (persist_path: "/data").
    volumes:
      - chroma_data:/data
    mem_limit: 768m
    memswap_limit: 1280m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  chroma_data:
  model_cache:
